# An action cannot be both permitted and forbidden.
purpose: Keep the counter from running away.
metric: count
controller:
  kind: threshold
  above: 10
  action: reset
cadence: 30s
permitted:
  - name: reset
    run: ./reset.sh
    cap: 3/day
    reversible: true
  - name: deploy
    run: ./deploy.sh
    cap: 1/day
    reversible: false
forbidden: [rm, deploy]
